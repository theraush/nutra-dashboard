<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NUTRA · Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F5F7;--card:#FFFFFF;--fg:#111118;--fg2:#6B6B7B;--border:#E4E4E7;--accent:#111118;--accent-fg:#FFFFFF;--err:#DC2626;--err-bg:#FEF2F2;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F0F14;--card:#1A1A24;--fg:#F2F2F5;--fg2:#9A9AAE;--border:#2A2A38;--accent:#F2F2F5;--accent-fg:#111118;--err:#F87171;--err-bg:#2A1515;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px Inter,system-ui,-apple-system,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 26px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand span{background:#fff;border-radius:8px;padding:0 4px;display:flex}
.brand img{height:40px;display:block}
.brand b{font-weight:800;letter-spacing:.06em}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--fg2);line-height:1.5}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--fg2)}
input{font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
input:focus{outline:2px solid #2563EB;outline-offset:1px;border-color:transparent}
button{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:10px;padding:12px;background:var(--accent);color:var(--accent-fg);cursor:pointer;margin-top:4px}
.err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 11px;margin:0;font-size:13px}
</style>
</head>
